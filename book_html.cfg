%% ============================================================
%% book_html.cfg —— tex4ht 配置（make4ht 调用）
%%
%% 作用：
%%   1) 启用 MathJax：公式不转成图片，交给浏览器端 MathJax v3 渲染，
%%      保留 \eqref/公式编号锚点，体积小、可缩放、可复制。
%%   2) 按“章”拆分页面：目录页 + 每章一个 HTML 文件，便于在线导航。
%%   3) 注入自定义 <head>：viewport、中文 lang、自定义 CSS、MathJax CDN。
%%   4) 顶部/底部导航条。
%% ============================================================

%% ---- 序言：输出格式 xhtml + utf-8 + mathjax --------------------
%% mathjax 选项让 make4ht 自动注入 MathJax v3 脚本（公式不转图，
%% 浏览器端渲染，保留 \eqref 编号锚点）。
%% 正文 6 个 tikzpicture → SVG：由 make4ht 命令行的 "tikz+" 模式驱动
%% （见 build_html.sh），把图整体抽出用 dvisvgm 渲染，避免 tex4ht 解析
%% xetex .xdv 中复杂 TikZ 字体定义而报 postamble 致命错误。
\Preamble{xhtml,charset=utf-8,mathjax}

%% ---- 注入自定义 <head>：自定义 CSS -----------------
%% 注意：HTML/JS 里的字面花括号会被 TeX 当作分组符，必须避免；
%% viewport 由 make4ht 默认注入，这里只补自定义样式表。
%% MathJax 脚本由 \Preamble 的 mathjax 选项负责。
\Configure{@HEAD}{%
  \HCode{<link rel="stylesheet" href="assets/style.css" type="text/css" />\Hnewline}%
}

%% ---- <html> 标签：保持 tex4ht 默认（已正确输出 lang='zh-CN'）---

%% ---- 顶部站点栏 + 正文容器 ------------------------------------
%% \Configure{BODY}{<进入body后插入>}{<离开body前插入>}
\Configure{BODY}
  {\HCode{<header class="site-header"><div class="site-wrap"><a class="site-title" href="index.html">\Hnewline}\HCode{引力波数据分析中的人工智能方法</a> <span class="site-sub">在线开源版</span></div></header>\Hnewline<div class="content">\Hnewline}}
  {\HCode{</div>\Hnewline<footer class="site-footer">}%
   \HCode{<p class="foot-main">引力波数据分析中的人工智能方法 · 王赫 · 在线开源版（初稿）</p>}%
   \HCode{<p class="foot-sub">本书持续更新中，欢迎通过 <a href="https://github.com/iphysresearch/gwai-monograph/issues">GitHub Issues</a> 提交勘误与建议。</p>}%
   \HCode{<p class="foot-sub">版权归作者及出版社所有；转载或引用请注明出处。</p>}%
   \HCode{</footer>\Hnewline}}

%% ---- 按章拆分页面 ---------------------------------------------
%% 拆分层级由传给 tex4ht 的配置选项数字控制（见 build_html.sh）：
%%   2 = 在 chapter 处拆分（目录页 + 每章一页）。不在此用 \CutAt。

\begin{document}
\EndPreamble
